name: rsl-taxathon
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taxathon
      POSTGRES_USER: taxathon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/dev_env.py first}
    ports: ["127.0.0.1:${POSTGRES_PORT:-55433}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxathon -d taxathon"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56380}:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
