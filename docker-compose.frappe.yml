name: rsl-taxathon-frappe-dev
services:
  mariadb:
    image: mariadb:11.8
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-snapshot-isolation=OFF"]
    environment:
      MARIADB_ROOT_PASSWORD: ${FRAPPE_DB_PASSWORD:?Run scripts/dev_env.py}
    volumes: ["frappe-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis-cache:
    image: redis:7-alpine
  redis-queue:
    image: redis:7-alpine
  frappe:
    image: frappe/bench@sha256:aae8521f4200c8c061b1ae7c514c4e83b38c2e178b5f3bb452ac3f54296f22a9
    command: ["sleep", "infinity"]
    working_dir: /workspace
    environment:
      SHELL: /bin/bash
    volumes:
      - frappe-workspace:/workspace
      - ./backend/vati_tax:/workspace/vati_tax
      # TAX-044 / ADR-023: the stdlib-only TAX-048 reconciliation, read-only. Only
      # `ai` is put on the path (frappe_dev.py init); no AI dependency is installed.
      - ./ai:/workspace/vati_shared/ai:ro
      # TAX-085 / ADR-035: the stdlib-only service adapters, read-only. frappe_dev.py init puts
      # their directories on the bench path and writes vati_services into the site config.
      - ./integration:/workspace/vati_shared/integration:ro
    # The site reaches local Jube/Docling/OpenAleph/yente on the developer's machine through
    # host.docker.internal (built in on Docker Desktop; this maps it on Linux Docker Engine).
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Ports are overridable so a second checkout can run its own isolated stack
    # (scripts/frappe_dev.py --project NAME --http-port N --socketio-port N).
    ports: ["127.0.0.1:${FRAPPE_HTTP_PORT:-58000}:8000", "127.0.0.1:${FRAPPE_SOCKETIO_PORT:-59000}:9000"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
volumes:
  frappe-db:
  frappe-workspace:
