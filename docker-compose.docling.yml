# Authenticated, bounded Docling Serve for local synthetic development (TAX-028).
# Use scripts/docling_dev.py. DOCLING_API_KEY comes from the ignored root .env (scripts/dev_env.py).
# CPU image: no GPU on developer laptops and less than half the download of the CUDA image.
# Default model weights ship inside the image; remote services, plugins and custom model configs
# stay disabled so documents never leave the container. See integration/docling/README.md.
name: rsl-taxathon-docling
services:
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.38.2@sha256:7a480a1604fa3b42efeddc7db9527690d9f9bc903226136013e2bfe6b1a4dfb0
    ports: ["127.0.0.1:55001:5001"]
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_API_KEY:?Set a generated DOCLING_API_KEY in .env}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_ALLOW_EXTERNAL_PLUGINS: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_CODE_FORMULA_CONFIG: "false"
      # Bounds aligned with the Vati contract (RegisterDocumentRequest.size_bytes max 25 MiB).
      DOCLING_SERVE_MAX_FILE_SIZE: "26214400"
      DOCLING_SERVE_MAX_NUM_PAGES: "50"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "300"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      HF_HUB_OFFLINE: "1"
    mem_limit: 4g
    restart: unless-stopped
