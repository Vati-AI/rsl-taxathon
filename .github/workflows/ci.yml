name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/dev.py check
      - run: python3 scripts/dev_env.py
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.frappe.yml config --quiet
      - run: docker compose -f docker-compose.docling.yml config --quiet
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python3 -m venv .venv-dev
      - run: .venv-dev/bin/python -m pip install -r requirements-dev.lock
      - run: npm ci
      - run: python3 scripts/quality.py
  auditor-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:auditor
      - run: npm run test:auditor:browser
  frontend-browser:
    # TAX-023: both portals at 1440/1024/390px with session mocks; no Frappe site needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:auditor
      - run: npm run test:frontend:browser
  ai-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r ai/requirements.lock
      - run: python ai/smoke.py
        env:
          LANGSMITH_TRACING: 'false'
      - run: python -m unittest discover -s tests/ai -p 'test_refund*.py' -v
        env:
          LANGSMITH_TRACING: 'false'
